services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_CONNECTION_STRING: Host=db;Port=5432;Database=admission;Username=admission;Password=admission
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: